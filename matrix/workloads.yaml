workloads:
  - id: control-aa
    kind: control_aa
    params: {prefill: 128, decode: 64, rounds: 2}
    est_minutes: 0.5

  - id: ob-story-200
    kind: single_stream
    params:
      label: "default: story prompt, 200 tokens out"
      prompt: "Please write a descriptive story about a llama named Alonso who grows up to be President of the Land of Llamas. Include details about Alonso's childhood, adolescent years, and how he grew up to be a political mover and shaker. Write the story with a sense of whimsy."
      decode: 200
      requests: 6
      warmup: 1
    est_minutes: 1
  - id: ob-512-200
    kind: single_stream
    params: {label: "-prompt-tokens 512, 200 tokens out", prefill: 512, decode: 200, requests: 6, warmup: 1}
    est_minutes: 1
  - id: ob-short-100
    kind: single_stream
    params: {label: "-p \"Write me a short story\" -max-tokens 100", prompt: "Write me a short story", decode: 100, requests: 6, warmup: 1}
    est_minutes: 0.5
  - id: ob-advanced-500
    kind: single_stream
    params:
      label: "-epochs 10 -temperature 0.7 -max-tokens 500 -seed 42 -warmup 2"
      prompt: "Please write a descriptive story about a llama named Alonso who grows up to be President of the Land of Llamas. Include details about Alonso's childhood, adolescent years, and how he grew up to be a political mover and shaker. Write the story with a sense of whimsy."
      decode: 500
      requests: 10
      warmup: 2
      temperature: 0.7
      seed: 42
    est_minutes: 2
  - id: lb-pp512
    kind: single_stream
    params: {label: "llama-bench pp512: prefill 512 tokens", prefill: 512, decode: 1, requests: 5, warmup: 1, primary: prefill_tok_s}
    est_minutes: 0.5
  - id: lb-tg128
    kind: single_stream
    params: {label: "llama-bench tg128: decode 128 tokens", prompt: "Hi", decode: 128, requests: 5, warmup: 1}
    est_minutes: 0.5
