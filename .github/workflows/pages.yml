name: pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [pie eval]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - run: .venv/bin/pie-evals dashboard --out site
        env: { GH_TOKEN: "${{ secrets.GH_RUNNER_PAT || github.token }}" }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
