name: collect
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "run whose out-* artifacts to import", required: true }

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[orchestrate]"
      - uses: actions/download-artifact@v4
        with: { pattern: "out-*", path: out, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - name: import into store
        run: |
          shopt -s nullglob
          dirs=(out/out-*)
          [ ${#dirs[@]} -gt 0 ] && .venv/bin/pie-evals collect --tier targeted "${dirs[@]}" || echo "no node outputs"
      - run: .venv/bin/pie-evals report --tier targeted --out reports
      - name: commit store and reports
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store reports
          git diff --cached --quiet || git commit -m "store: targeted run ${{ inputs.run_id }}"
          git pull --rebase --quiet origin main && git push --quiet origin HEAD:main
