[project]
name = "stats"
version = "0.1.0"
description = "pie vs Ollama local inference benchmarks on self-hosted Macs."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "click>=8.1",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
orchestrate = ["requests>=2.31"]
quality = ["lm-eval[ifeval]>=0.4", "transformers", "jinja2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
pie-evals-node = "pie_evals.node.cli:main"
pie-evals = "pie_evals.orchestrate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pie_evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP017", "B008", "B905"]
